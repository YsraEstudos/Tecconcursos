<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Instalar TecConcursos Scraper - Tampermonkey</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #e2e8f0;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        h1 { color: #60a5fa; font-size: 22px; margin-bottom: 12px; }
        p { color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
        .btn {
            display: inline-block;
            padding: 14px 32px;
            background: #10b981;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
        }
        .btn:hover { background: #059669; }
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎯 TecConcursos Scraper</h1>
        <p>Clique no botão abaixo para instalar o script no Tampermonkey.</p>
        <a class="btn" id="installBtn" href="#">⬇️ Instalar no Tampermonkey</a>
        <p class="note">Requer a extensão Tampermonkey instalada no navegador.</p>
    </div>
    <script>
        // Redireciona via JavaScript para que o Tampermonkey intercepte a navegação
        document.getElementById('installBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'https://raw.githubusercontent.com/YsraEstudos/Tecconcursos/main/tecconcursos-scraper.user.js';
        });
    </script>
</body>
</html>
